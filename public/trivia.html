<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Gran Trivia de Mayo 🇦🇷</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --celeste: #74b9ff;
            --azul-oscuro: #0d2c54;
            --amarillo-sol: #fbcb3b;
            --blanco: #ffffff;
            --gris-fondo: #f5f6fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, var(--blanco) 0%, #e3f2fd 100%);
            color: var(--azul-oscuro);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow: hidden;
        }

        /* Layout de dos columnas: QR a la izquierda, Ranking a la derecha */
        .pantalla-layout {
            display: flex;
            width: 100%;
            max-width: 1350px;
            gap: 30px;
            align-items: flex-start;
            margin-top: 10px;
        }

        /* Columna Izquierda: Bloque del QR */
        .bloque-qr-acceso {
            flex: 1;
            background: var(--blanco);
            border: 4px solid var(--azul-oscuro);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0px 15px 35px rgba(13, 44, 84, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 520px;
        }

        .bloque-qr-acceso h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: var(--azul-oscuro);
        }

        /* Contenedor del QR con marco prolijo */
        #contenedor-qr {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #ced4da;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .bloque-qr-acceso p {
            font-size: 1.2rem;
            color: #57606f;
            font-weight: 600;
            line-height: 1.4;
        }

        /* Columna Derecha: Contenedor del Leaderboard */
        .contenedor-ranking {
            flex: 2;
            background: var(--blanco);
            border: 4px solid var(--azul-oscuro);
            border-radius: 24px;
            box-shadow: 0px 20px 40px rgba(13, 44, 84, 0.2);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 520px;
        }

        /* Encabezado Principal Arriba */
        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--azul-oscuro);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }

        .sol-patrio {
            font-size: 3rem;
            animation: spin 20s linear infinite;
            display: inline-block;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Filas del Ranking */
        .fila-ranking {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--gris-fondo);
            border-radius: 12px;
            border-left: 6px solid #ced4da;
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* Estilos para el PODIO (Top 3) */
        .fila-ranking.puesto-1 {
            background: #fff9db;
            border-left: 6px solid var(--amarillo-sol);
            transform: scale(1.01);
            font-size: 1.7rem;
            padding: 14px 25px;
            box-shadow: 0px 4px 12px rgba(251, 203, 59, 0.2);
        }
        .fila-ranking.puesto-2 {
            background: #f1f2f6;
            border-left: 6px solid #a4b0be;
            font-size: 1.5rem;
        }
        .fila-ranking.puesto-3 {
            background: #faf0e6;
            border-left: 6px solid #cd7f32;
            font-size: 1.45rem;
        }

        .izquierda-bloque {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .numero-puesto {
            min-width: 40px;
            text-align: center;
        }

        .medalla {
            font-size: 1.8rem;
        }

        .nombre-usuario {
            color: var(--azul-oscuro);
        }

        .puntos-usuario {
            color: #27ae60;
            background: rgba(46, 204, 113, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            text-align: right;
            min-width: 130px;
        }

        .sin-jugadores {
            text-align: center;
            padding: 60px;
            font-size: 1.6rem;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <div class="sol-patrio">☀️</div>
        <h1>Gran Trivia de Mayo</h1>
    </header>

    <div class="pantalla-layout">
        
        <div class="bloque-qr-acceso">
            <h2>¡Sumate a Jugar!</h2>
            
            <div id="contenedor-qr"></div>
            
            <p>Escaneá el código QR con tu celular,<br>ingresá tu Instagram y participá en vivo 🇦🇷</p>
        </div>

        <div class="contenedor-ranking" id="lista-leaderboard">
            <div class="sin-jugadores">Esperando que se conecten los primeros patriotas... 🇦🇷</div>
        </div>

    </div>

    <script>
        const socket = io();
        const contenedorLista = document.getElementById('lista-leaderboard');

        // AUTO-GENERACIÓN DEL QR BASADO EN LA URL ACTUAL DE LA TV
        // Esto toma dinámicamente el dominio (sea localhost:3000 o tu subdominio de Render)
        const urlTrivia = window.location.origin; 
        
        new QRCode(document.getElementById("contenedor-qr"), {
            text: urlTrivia,
            width: 260,
            height: 260,
            colorDark : "#0d2c54", // Azul corporativo
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // Escucha el ranking en tiempo real enviado por server.js
        socket.on('update_ranking', (listaJugadores) => {
            if (!listaJugadores || listaJugadores.length === 0) {
                contenedorLista.innerHTML = '<div class="sin-jugadores">Esperando que se conecten los primeros patriotas... 🇦🇷</div>';
                return;
            }

            contenedorLista.innerHTML = '';

            // Tomamos los mejores 10 de la lista general
            const top10 = listaJugadores.slice(0, 10);

            top10.forEach((jugador, indice) => {
                const numPuesto = indice + 1;
                const fila = document.createElement('div');
                
                let clasePuesto = 'fila-ranking';
                let indicadorPuesto = `#${numPuesto}`;

                if (numPuesto === 1) {
                    clasePuesto += ' puesto-1';
                    indicadorPuesto = '<span class="medalla">🥇</span>';
                } else if (numPuesto === 2) {
                    clasePuesto += ' puesto-2';
                    indicadorPuesto = '<span class="medalla">🥈</span>';
                } else if (numPuesto === 3) {
                    clasePuesto += ' puesto-3';
                    indicadorPuesto = '<span class="medalla">🥉</span>';
                }

                fila.className = clasePuesto;
                fila.innerHTML = `
                    <div class="izquierda-bloque">
                        <div class="numero-puesto">${indicadorPuesto}</div>
                        <div class="nombre-usuario">@${jugador.username}</div>
                    </div>
                    <div class="puntos-usuario">${jugador.puntos} pts</div>
                `;
                
                contenedorLista.appendChild(fila);
            });
        });
    </script>
</body>
</html>
