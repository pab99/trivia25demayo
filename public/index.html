<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia de Mayo 🇦🇷</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --celeste: #74b9ff;
            --azul-oscuro: #0d2c54;
            --amarillo-sol: #fbcb3b;
            --amarillo-hover: #f1c40f;
            --rojo-error: #ff7675;
            --verde-exito: #2ecc71;
        }

        body {
            background: radial-gradient(circle, #ffffff 0%, #e3f2fd 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .contenedor-movil { 
            padding: 20px; 
            max-width: 480px; 
            margin: auto; 
        }

        .tarjeta-patria {
            background: #ffffff;
            border: 3px solid var(--azul-oscuro);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0px 10px 25px rgba(13, 44, 84, 0.15);
            margin-top: 10px;
        }

        .pantalla { display: none; }
        .pantalla.activa { display: block; }

        .teclado { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 6px; 
            margin-top: 20px; 
            background: #f5f6fa;
            padding: 10px;
            border-radius: 12px;
        }
        .teclado button { 
            padding: 14px 2px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            background: #ffffff; 
            border: 1px solid #ced4da; 
            border-radius: 6px; 
            color: var(--azul-oscuro);
            box-shadow: 0px 2px 4px rgba(0,0,0,0.05);
            transition: all 0.1s ease;
        }
        .teclado button:active { transform: scale(0.92); }
        .teclado .btn-ancho { grid-column: span 2; background: var(--rojo-error); color: white; border-color: #d63031; }
        .teclado .btn-action { grid-column: span 2; background: var(--verde-exito); color: white; border-color: #27ae60; }

        .input-ig { 
            font-size: 1.6rem; 
            width: 100%; 
            padding: 12px; 
            text-align: center; 
            border: 2px solid var(--azul-oscuro); 
            border-radius: 10px; 
            margin-bottom: 5px; 
            box-sizing: border-box;
            background: #fffdf3;
            font-weight: bold;
            color: var(--azul-oscuro);
        }

        .opcion-btn { 
            display: block; 
            width: 100%; 
            padding: 16px; 
            margin: 12px 0; 
            font-size: 1.15rem; 
            font-weight: bold; 
            color: var(--azul-oscuro);
            background: var(--amarillo-sol); 
            border: 2px solid #d4a314; 
            border-radius: 12px; 
            text-align: left; 
            box-shadow: 0px 4px 6px rgba(0,0,0,0.08);
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
        }
        .opcion-btn:not([disabled]):hover { background: var(--amarillo-hover); }
        .opcion-btn:active { transform: scale(0.98); }

        .opcion-btn.correcta-anim {
            background: var(--verde-exito) !important;
            border-color: #27ae60 !important;
            color: white !important;
        }
        .opcion-btn.incorrecta-anim {
            background: var(--rojo-error) !important;
            border-color: #c0392b !important;
            color: white !important;
        }

        .header-juego { 
            display: flex; 
            justify-content: space-between; 
            font-weight: bold; 
            margin-bottom: 15px; 
            background: var(--azul-oscuro); 
            color: white;
            padding: 12px; 
            border-radius: 10px; 
            font-size: 0.95rem;
        }
        .emojis-patrios { font-size: 1.8rem; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="contenedor-movil">
        
        <div id="pantalla-login" class="pantalla activa tarjeta-patria">
            <div class="emojis-patrios">🇦🇷 🏛️ ☀️ 🇦🇷</div>
            <h2 style="color: var(--azul-oscuro); margin-top: 0;">¡Gran Trivia de Mayo!</h2>
            <p style="color: #57606f; font-size: 0.95rem;">Ingresá tu usuario de Instagram para ver tu nombre en la pantalla gigante:</p>
            <input type="text" id="username-display" class="input-ig" placeholder="@tu_usuario" readonly>
            
            <div class="teclado" id="teclado-virtual"></div>
        </div>

        <div id="pantalla-juego" class="pantalla tarjeta-patria">
            <div class="header-juego">
                <span id="txt-usuario">@-</span>
                <span id="txt-puntos">Pts: 0</span>
                <span id="txt-vidas">❤️ ❤️ ❤️</span>
            </div>
            <div id="txt-combo" style="color: #e67e22; font-weight: bold; min-height: 20px; font-size: 1.1rem; text-align: center;"></div>
            
            <h3 id="pregunta-titulo" style="margin: 20px 0; font-size: 1.3rem; color: var(--azul-oscuro); text-align: left; line-height: 1.4;">Cargando pregunta...</h3>
            <div id="contenedor-opciones"></div>
        </div>

        <div id="pantalla-fin" class="pantalla tarjeta-patria">
            <h2 id="fin-titulo" style="font-size: 1.8rem;">¡Fin de la partida!</h2>
            <p id="fin-mensaje" style="color: #57606f; line-height: 1.4;"></p>
            <div style="font-size: 1.1rem; color: #7f8c8d;">Puntaje obtenido en esta ronda:</div>
            <h3 id="fin-puntos" style="font-size: 2.5rem; color: var(--azul-oscuro); margin: 10px 0;">0 pts</h3>
            <button class="opcion-btn" style="text-align:center; background: var(--azul-oscuro); color: white; border-color: var(--azul-oscuro);" onclick="revancha()">🔄 Volver a Jugar (Revancha)</button>
        </div>

    </div>

    <script>
        const socket = io();
        let username = "";
        let preguntaActual = null;
        let intentoActual = 1;
        let tiempoInicio = 0;
        let puntosLocales = 0;

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.04);
                } else if (type === 'success') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.06);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.12);
                    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.18);
                    gain.gain.setValueAtTime(0.12, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                    osc.start(); osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(70, ctx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'combo') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                    osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch(e) { console.log("Audio deshabilitado"); }
        }

        const keys = [
            '1','2','3','4','5','6','7','8','9','0',
            'q','w','e','r','t','y','u','i','o','p',
            'a','s','d','f','g','h','j','k','l','_',
            'z','x','c','v','b','n','m','.','-','@'
        ];
        const teclado = document.getElementById('teclado-virtual');
        
        keys.forEach(key => {
            const btn = document.createElement('button');
            btn.innerText = key;
            btn.onclick = () => {
                playSound('click');
                if (username.length < 20) {
                    username += key;
                    document.getElementById('username-display').value = username;
                }
            };
            teclado.appendChild(btn);
        });

        const btnBorrar = document.createElement('button');
        btnBorrar.innerText = '⌫';
        btnBorrar.className = 'btn-ancho';
        btnBorrar.onclick = () => {
            playSound('click');
            username = username.slice(0, -1);
            document.getElementById('username-display').value = username;
        };
        teclado.appendChild(btnBorrar);

        const btnJugar = document.createElement('button');
        btnJugar.innerText = 'INGRESAR';
        btnJugar.className = 'btn-action';
        btnJugar.onclick = () => {
            if (username.trim().length > 2) {
                playSound('success');
                document.getElementById('txt-usuario').innerText = "@" + username.replace('@','');
                socket.emit('join_game', username);
                cambiarPantalla('pantalla-juego');
                socket.emit('get_pregunta');
            } else {
                alert('Ingresá tu usuario de Instagram.');
            }
        };
        teclado.appendChild(btnJugar);

        function cambiarPantalla(id) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(id).classList.add('activa');
        }

        socket.on('pregunta_data', (data) => {
            preguntaActual = data;
            intentoActual = 1;
            tiempoInicio = Date.now();

            document.getElementById('pregunta-titulo').innerText = data.pregunta;
            const contenedor = document.getElementById('contenedor-opciones');
            contenedor.innerHTML = '';

            data.opciones.forEach(opcion => {
                const btn = document.createElement('button');
                btn.className = 'opcion-btn';
                btn.innerText = opcion;
                btn.onclick = () => responder(opcion, btn);
                contenedor.appendChild(btn);
            });
        });

        function responder(opcionSeleccionada, boton) {
            playSound('click');
            const tiempoEmpleado = (Date.now() - tiempoInicio) / 1000;
            document.querySelectorAll('.opcion-btn').forEach(b => b.disabled = true);
            boton.id = "btn-evaluando";

            socket.emit('enviar_respuesta', {
                preguntaId: preguntaActual.id,
                respuesta: opcionSeleccionada,
                intento: intentoActual,
                tiempoEmpleado: tiempoEmpleado
            });
        }

        socket.on('resultado_respuesta', (res) => {
            const btnPresionado = document.getElementById('btn-evaluando');
            
            if (res.correcta) {
                playSound('success');
                if (btnPresionado) btnPresionado.classList.add('correcta-anim');
                
                puntosLocales = res.puntos;
                document.getElementById('txt-puntos').innerText = `Pts: ${puntosLocales}`;
                
                if ([3, 6, 9, 12].includes(res.combo)) {
                    playSound('combo');
                    document.getElementById('txt-combo').innerText = `🔥 ¡COMBO x${res.combo === 3 ? 2 : res.combo === 6 ? 4 : res.combo === 9 ? 6 : 10}! 🔥`;
                } else {
                    document.getElementById('txt-combo').innerText = `Racha: ${res.combo} seguidas`;
                }
                
                setTimeout(() => {
                    if (btnPresionado) btnPresionado.id = "";
                    socket.emit('get_pregunta');
                }, 1200);
            } else {
                playSound('fail');
                if (btnPresionado) btnPresionado.classList.add('incorrecta-anim');
                
                setTimeout(() => {
                    if (btnPresionado) {
                        btnPresionado.id = "";
                        btnPresionado.classList.remove('incorrecta-anim');
                    }
                    
                    if (res.intento === 1) {
                        intentoActual = 2;
                        alert('❌ ¡Incorrecto! Te queda un intento para esta pregunta (por 5 pts).');
                        document.querySelectorAll('.opcion-btn').forEach(b => b.disabled = false);
                    } else {
                        document.getElementById('txt-combo').innerText = "";
                        actualizarVidas(res.vidas);
                        socket.emit('get_pregunta');
                    }
                }, 1200);
            }
        });

        function actualizarVidas(vidas) {
            let coras = "";
            for(let i=0; i<3; i++) {
                coras += i < vidas ? "❤️ " : "🖤 ";
            }
            document.getElementById('txt-vidas').innerText = coras;
        }

        socket.on('game_over', (res) => {
            cambiarPantalla('pantalla-fin');
            document.getElementById('fin-titulo').innerText = "¡Derrota Colonial! 🖤";
            document.getElementById('fin-mensaje').innerText = "Se agotaron tus vidas. Tu puntaje máximo quedó registrado en la pantalla gigante. ¡Podés revanchar para intentar superarlo!";
            document.getElementById('fin-puntos').innerText = `${puntosLocales} pts`;
        });

        socket.on('game_completed', (res) => {
            cambiarPantalla('pantalla-fin');
            document.getElementById('fin-titulo').innerText = "¡Héroe de la Patria! 🥇🇦🇷";
            document.getElementById('fin-mensaje').innerText = "¡Excelente! Respondiste todo el banco de preguntas histórico de manera impecable.";
            document.getElementById('fin-puntos').innerText = `${puntosLocales} pts`;
        });

        function revancha() {
            playSound('click');
            puntosLocales = 0;
            document.getElementById('txt-puntos').innerText = "Pts: 0";
            document.getElementById('txt-vidas').innerText = "❤️ ❤️ ❤️";
            document.getElementById('txt-combo').innerText = "";
            socket.emit('reset_game');
        }

        socket.on('game_resetted', () => {
            cambiarPantalla('pantalla-juego');
            socket.emit('get_pregunta');
        });
    </script>
</body>
</html>
