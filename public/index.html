<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia de Mayo 🇦🇷</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --celeste: #74b9ff;
            --azul-oscuro: #0d2c54;
            --amarillo-sol: #fbcb3b;
            --amarillo-hover: #f1c40f;
            --rojo-error: #ff7675;
            --verde-exito: #2ecc71;
        }

        body {
            background: radial-gradient(circle, #ffffff 0%, #e3f2fd 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .contenedor-movil { 
            padding: 20px; 
            max-width: 480px; 
            margin: auto; 
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }

        .tarjeta-patria {
            background: #ffffff;
            border: 3px solid var(--azul-oscuro);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0px 10px 25px rgba(13, 44, 84, 0.15);
            margin-top: 10px;
        }

        .pantalla { display: none; }
        .pantalla.activa { display: block; }

        .contenedor-timer {
            width: 100%;
            background-color: #eee;
            border-radius: 8px;
            height: 12px;
            margin-top: 10px;
            overflow: hidden;
            border: 1px solid var(--azul-oscuro);
        }
        .barra-timer {
            width: 100%;
            height: 100%;
            background-color: var(--celeste);
            transition: width 0.1s linear;
        }

        .teclado { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 6px; 
            margin-top: 15px; 
            background: #f5f6fa;
            padding: 10px;
            border-radius: 12px;
        }
