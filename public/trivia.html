<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Gigante - Trivia de Mayo 🇦🇷</title>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root {
            --azul-patrio: #0d2c54;
            --celeste-patrio: #74b9ff;
            --amarillo-sol: #fbcb3b;
            --blanco-puro: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #ffffff 0%, #e3f2fd 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* DISEÑO DE PANTALLA DIVIDIDA (SPLIT SCREEN) */
        .columna-qr {
            width: 35%;
            background-color: var(--azul-patrio);
            color: var(--blanco-puro);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 6px solid var(--amarillo-sol);
            box-sizing: border-box;
            padding: 40px;
            text-align: center;
        }

        .qr-placeholder {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: 25px 0;
            display: inline-block;
        }
        
        .qr-placeholder img {
            display: block;
            width: 280px;
            height: 280px;
            object-fit: contain;
        }

        .columna-dinamica {
            width: 65%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            box-sizing: border-box;
        }

        .tarjeta-contenedor {
            background: var(--blanco-puro);
            border: 4px solid var(--azul-patrio);
            border-radius: 24px;
            width: 100%;
            max-width: 900px;
            height: 80vh;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(13, 44, 84, 0.12);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .modulo-pantalla {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-in-out;
        }

        h2 {
            color: var(--azul-patrio);
            font-size: 2.5rem;
            margin-top: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* TABLA DE POSICIONES ORIGINAL */
        .tabla-leaderboard {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 1.6rem;
        }
        .tabla-leaderboard tr {
            border-bottom: 2px solid #f1f2f6;
        }
        .tabla-leaderboard td {
            padding: 18px 15px;
            color: #2c3e50;
        }
        .puesto-top { font-weight: bold; color: var(--azul-patrio); width: 10%; }
        .usuario-name { font-weight: 600; width: 65%; }
        .puntos-total { text-align: right; font-weight: bold; color: #2ecc71; width: 25%; }

        /* SECCIÓN SABÍAS QUE */
        .contenido-curioso {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            text-align: center;
            padding: 0 30px;
        }

        .texto-pregunta {
            color: var(--azul-patrio);
            font-size: 2.6rem;
            margin-bottom: 25px;
            line-height: 1.3;
            font-weight: bold;
        }

        .texto-explicacion {
            font-size: 1.8rem;
            color: #57606f;
            line-height: 1.6;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 16px;
            border-left: 6px solid var(--celeste-patrio);
            text-align: left;
            width: 100%;
            box-sizing: border-box;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.99); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="columna-qr">
        <h1 style="font-size: 2.6rem; margin: 0; letter-spacing: 1px; line-height: 1.2;">¡SUMATE A JUGAR!</h1>
        <p style="font-size: 1.2rem; opacity: 0.9; margin-top: 10px;">Escaneá el código con tu celular para ingresar tu usuario de Instagram:</p>
        
        <div class="qr-placeholder">
            <img src="img/qr-trivia.png" alt="QR Code" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://trivia25demayo.onrender.com'">
        </div>
        
        <div style="font-size: 1.4rem; font-weight: bold; background: var(--amarillo-sol); color: var(--azul-patrio); padding: 12px 24px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);">
            trivia25demayo.onrender.com
        </div>
    </div>

    <div class="columna-dinamica">
        <div class="tarjeta-contenedor">
            
            <div id="contenedor-ranking" class="modulo-pantalla">
                <h2>🏆 Tabla de Posiciones 🏆</h2>
                <table class="tabla-leaderboard">
                    <tbody id="lista-posiciones">
                        <tr>
                            <td class="puesto-top">#1</td>
                            <td class="usuario-name">@esperando_jugadores</td>
                            <td class="puntos-total">0 pts</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div id="contenedor-sabiasque" class="modulo-pantalla" style="display: none;">
                <h2>💡 ¿Sabías que...?</h2>
                <div class="contenido-curioso">
                    <div id="display-pregunta" class="texto-pregunta">Cargando dato histórico...</div>
                    <div id="display-explicacion" class="texto-explicacion">Por favor espere.</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // LÓGICA ORIGINAL DE CONEXIÓN CON TU BACKEND
        const socket = io();
        
        socket.on('actualizar_ranking', (usuarios) => {
            console.log("Ranking recibido desde el backend:", usuarios);
            const tabla = document.getElementById('lista-posiciones');
            if (!tabla) return;
            
            // Mapeo directo clásico que usaba tu servidor funcional
            tabla.innerHTML = usuarios.map((user, index) => `
                <tr>
                    <td class="puesto-top">#${index + 1}</td>
                    <td class="usuario-name">@${user.username}</td>
                    <td class="puntos-total">${user.puntos} pts</td>
                </tr>
            `).join('');
        });

        // DATOS CURIOSOS
        const datosCuriosos = [
            {
                pregunta: "¿Quién fue el miembro más joven de la Primera Junta?",
                explicacion: "¡Juan Larrea! Tenía solo 27 años cuando asumió como vocal el 25 de mayo de 1810."
            },
            {
                pregunta: "¿El sol de la bandera ya existía en la Revolución de Mayo?",
                explicacion: "No, el 'Sol de Mayo' se adoptó recién en 1813. Está inspirado en el dios del sol Inca, Inti."
            },
            {
                pregunta: "¿Realmente se repartieron cintas celestes y blancas?",
                explicacion: "Los historiadores afirman que en realidad eran cintas blancas (unión) y rojas (guerra), o retratos del rey Fernando VII."
            },
            {
                pregunta: "¿Hizo buen tiempo aquel 25 de mayo?",
                explicacion: "La tradición del 'Sol de Mayo' es literal: los registros confirman que el día estuvo lluvioso, frío y muy nublado."
            },
            {
                pregunta: "¿Dónde se reunía en secreto la sociedad patriótica antes de la revolución?",
                explicacion: "Se juntaban en la famosa Jabonería de Vieytes. Era el búnker conspirativo camuflado como negocio."
            }
        ];

        // LÓGICA DE ROTACIÓN CADA 10 SEGUNDOS (Sin alterar variables de red)
        let indiceCurioso = 0;
        let mostrandoRanking = true;

        function ejecutarRotacion() {
            const divRanking = document.getElementById('contenedor-ranking');
            const divSabiasQue = document.getElementById('contenedor-sabiasque');
            
            if (!divRanking || !divSabiasQue) return;

            if (mostrandoRanking) {
                divRanking.style.display = 'none';
                divSabiasQue.style.display = 'flex';
                
                const datoActual = datosCuriosos[indiceCurioso];
                document.getElementById('display-pregunta').innerText = datoActual.pregunta;
                document.getElementById('display-explicacion').innerText = datoActual.explicacion;
                
                indiceCurioso = (indiceCurioso + 1) % datosCuriosos.length;
                mostrandoRanking = false;
            } else {
                divSabiasQue.style.display = 'none';
                divRanking.style.display = 'flex';
                mostrandoRanking = true;
            }
        }

        // Intervalo cíclico nativo
        setInterval(ejecutarRotacion, 10000);
    </script>
</body>
</html>
