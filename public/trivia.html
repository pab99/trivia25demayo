<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Gran Trivia de Mayo 🇦🇷</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --celeste: #74b9ff;
            --azul-oscuro: #0d2c54;
            --amarillo-sol: #fbcb3b;
            --blanco: #ffffff;
            --gris-fondo: #f5f6fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, var(--blanco) 0%, #e3f2fd 100%);
            color: var(--azul-oscuro);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            overflow: hidden;
        }

        .pantalla-layout {
            display: flex;
            width: 100%;
            max-width: 1350px;
            gap: 30px;
            align-items: flex-start;
            margin-top: 10px;
            flex: 1;
        }

        .bloque-qr-acceso {
            flex: 1;
            background: var(--blanco);
            border: 4px solid var(--azul-oscuro);
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0px 15px 35px rgba(13, 44, 84, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 520px;
        }

        .bloque-qr-acceso h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            color: var(--azul-oscuro);
        }

        #contenedor-qr {
            background: white;
            padding: 20px;
            border-radius: 16px;
            border: 2px solid #ced4da;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .bloque-qr-acceso p {
            font-size: 1.2rem;
            color: #57606f;
            font-weight: 600;
            line-height: 1.4;
        }

        .contenedor-ranking {
            flex: 2;
            background: var(--blanco);
            border: 4px solid var(--azul-oscuro);
            border-radius: 24px;
            box-shadow: 0px 20px 40px rgba(13, 44, 84, 0.2);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 520px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
        }

        header h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--azul-oscuro);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            margin-bottom: 5px;
        }

        .sol-patrio {
            font-size: 3rem;
            animation: spin 20s linear infinite;
            display: inline-block;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .fila-ranking {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--gris-fondo);
            border-radius: 12px;
            border-left: 6px solid #ced4da;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .fila-ranking.puesto-1 {
            background: #fff9db;
            border-left: 6px solid var(--amarillo-sol);
            transform: scale(1.01);
            font-size: 1.7rem;
            padding: 14px 25px;
            box-shadow: 0px 4px 12px rgba(251, 203, 59, 0.2);
        }
        .fila-ranking.puesto-2 {
            background: #f1f2f6;
            border-left: 6px solid #a4b0be;
            font-size: 1.5rem;
        }
        .fila-ranking.puesto-3 {
            background: #faf0e6;
            border-left: 6px solid #cd7f32;
            font-size: 1.45rem;
        }

        .izquierda-bloque {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .numero-puesto { min-width: 40px; text-align: center; }
        .medalla { font-size: 1.8rem; }
        .nombre-usuario { color: var(--azul-oscuro); }

        .puntos-usuario {
            color: #27ae60;
            background: rgba(46, 204, 113, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            text-align: right;
            min-width: 130px;
        }

        .sin-jugadores {
            text-align: center;
            padding: 60px;
            font-size: 1.6rem;
            color: #7f8c8d;
            font-style: italic;
        }

        footer {
            text-align: center;
            padding: 15px 0 5px 0;
            font-size: 0.95rem;
            color: #7f8c8d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 20px;
        }

        .logo-tecnoincas {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, var(--amarillo-sol) 0deg 30deg, #d4a314 30deg 60deg);
            border: 2px solid #555;
            display: inline-block;
            position: relative;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .logo-tecnoincas::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #95a5a6;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #555;
        }
    </style>
</head>
<body>

    <header>
        <div class="sol-patrio">☀️</div>
        <h1>Gran Trivia de Mayo</h1>
    </header>

    <div class="pantalla-layout">
        <div class="bloque-qr-acceso">
            <h2>¡Sumate a Jugar!</h2>
            <div id="contenedor-qr"></div>
            <p>Escaneá el código QR con tu celular,<br>ingresá tu Instagram y participá en vivo 🇦🇷</p>
        </div>

        <div class="contenedor-ranking" id="lista-leaderboard">
            <div class="sin-jugadores">Esperando que se conecten los primeros patriotas... 🇦🇷</div>
        </div>
    </div>

    <footer>
        <div class="logo-tecnoincas"></div>
        <span>(R) Tecnoincas.com.ar</span>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const socket = io();
            const urlTrivia = window.location.origin; 
            
            new QRCode(document.getElementById("contenedor-qr"), {
                text: urlTrivia,
                width: 260,
                height: 260,
                colorDark : "#0d2c54",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            socket.on('connect', () => {
                console.log("Pantalla de Ranking conectada. Solicitando historial permanente...");
                socket.emit('pedir_ranking_dashboard'); 
            });

            socket.on('update_ranking', (listaJugadores) => {
                actualizarPantallaRankingCompleta(listaJugadores);
            });

            socket.on('data_ranking_dashboard', (listaJugadores) => {
                actualizarPantallaRankingCompleta(listaJugadores);
            });

            function actualizarPantallaRankingCompleta(listaJugadores) {
                const listaUI = document.getElementById('lista-leaderboard'); 
                if (!listaUI) return;

                listaUI.innerHTML = ""; 

                if (listaJugadores.length === 0) {
                    listaUI.innerHTML = "<div class='sin-jugadores'>Esperando que se conecten los primeros patriotas... 🇦🇷</div>";
                    return;
                }

                listaJugadores.forEach((jugador, index) => {
                    let medalla = "";
                    let clasePuesto = "";
                    
                    if (index === 0) { medalla = "🥇 "; clasePuesto = "puesto-1"; }
                    else if (index === 1) { medalla = "🥈 "; clasePuesto = "puesto-2"; }
                    else if (index === 2) { medalla = "🥉 "; clasePuesto = "puesto-3"; }

                    const item = document.createElement('div');
                    item.className = `fila-ranking ${clasePuesto}`; 
                    item.innerHTML = `
                        <div class="izquierda-bloque">
                            <span class="numero-puesto">${medalla}#${index + 1}</span>
                            <span class="nombre-usuario">@${jugador.username}</span>
                        </div>
                        <span class="puntos-usuario">${jugador.puntos} pts</span>
                    `;
                    listaUI.appendChild(item);
                });
            }
        });
    </script>
</body>
</html>
