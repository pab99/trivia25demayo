<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Gigante - Trivia de Mayo 🇦🇷</title>
    <script src="/socket.io/socket.io.js"></script>
    
    <style>
        :root {
            --azul-patrio: #0d2c54;
            --celeste-patrio: #74b9ff;
            --amarillo-sol: #fbcb3b;
            --blanco-puro: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #ffffff 0%, #e3f2fd 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* DISEÑO DE PANTALLA DIVIDIDA (SPLIT SCREEN) */
        .columna-qr {
            width: 35%;
            background-color: var(--azul-patrio);
            color: var(--blanco-puro);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 6px solid var(--amarillo-sol);
            box-sizing: border-box;
            padding: 40px;
            text-align: center;
        }

        .qr-placeholder {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: 25px 0;
            display: inline-block;
        }
        
        .qr-placeholder img {
            display: block;
            width: 280px;
            height: 280px;
            object-fit: contain;
        }

        .columna-dinamica {
            width: 65%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            box-sizing: border-box;
        }

        .tarjeta-contenedor {
            background: var(--blanco-puro);
            border: 4px solid var(--azul-patrio);
            border-radius: 24px;
            width: 100%;
            max-width: 900px;
            height: 80vh;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(13, 44, 84, 0.12);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .modulo-pantalla {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.4s ease-in-out;
        }

        h2 {
            color: var(--azul-patrio);
            font-size: 2.5rem;
            margin-top: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ESTILOS DE LA TABLA DE POSICIONES */
        .tabla-leaderboard {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 1.6rem;
        }
        .tabla-leaderboard tr {
            border-bottom: 2px solid #f1f2f6;
        }
        .tabla-leaderboard td {
            padding: 18px 15px;
            color: #2c3e50;
        }
        .puesto-top { font-weight: bold; color: var(--azul-patrio); width: 15%; }
        .usuario-name { font-weight: 600; width: 60%; }
        .puntos-total { text-align: right; font-weight: bold; color: #2ecc71; width: 25%; }

        .contenido-curioso {

            flex-direction: column;
            justify-content: center;
