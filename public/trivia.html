<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla Gigante - Trivia de Mayo 🇦🇷</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="/socket.io/socket.io.js"></script>
    
    <script src="datos-curiosos.js"></script>

    <style>
        :root {
            --azul-patrio: #0d2c54;
            --celeste-patrio: #74b9ff;
            --amarillo-sol: #fbcb3b;
            --blanco-puro: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #ffffff 0%, #e3f2fd 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* DISEÑO DE PANTALLA DIVIDIDA (SPLIT SCREEN) */
        .columna-qr {
            width: 35%;
            background-color: var(--azul-patrio);
            color: var(--blanco-puro);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-right: 6px solid var(--amarillo-sol);
            box-sizing: border-box;
            padding: 40px;
            text-align: center;
        }

        .qr-placeholder {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: 25px 0;
            display: inline-block;
        }
        
        .qr-placeholder img {
            display: block;
            width: 280px;
            height: 280px;
        }

        .columna-dinamica {
            width: 65%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
            box-sizing: border-box;
        }

        .tarjeta-contenedor {
            background: var(--blanco-puro);
            border: 4px solid var(--azul-patrio);
            border-radius: 24px;
            width: 100%;
            max-width: 900px;
            height: 80vh;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(13, 44, 84, 0.12);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .modulo-pantalla {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.5s ease-in-out;
        }

        h2 {
            color: var(--azul-patrio);
            font-size: 2.5rem;
            margin-top: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* TABLA RANKING */
        .tabla-leaderboard {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 1.6rem;
        }
        .tabla-leaderboard tr {
            border-bottom: 2px solid #f1f2f6;
        }
        .tabla-leaderboard td {
            padding: 18px 15px;
            color: #2c3e50;
        }
        .puesto-top { font-weight: bold; color: var(--azul-patrio); width: 10%; }
        .usuario-name { font-weight: 600; width: 65%; }
        .puntos-total { text-align: right; font-weight: bold; color: #2ecc71; width: 25%; }

        /* SECCIÓN SABÍAS QUE */
        .contenido-curioso {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex: 1;
            text-align: center;
            padding: 0 30px;
        }

        .texto-pregunta {
            color: var(--azul-patrio);
            font-size: 2.6rem;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .texto-explicacion {
            font-size: 1.8rem;
            color: #57606f;
            line-height: 1.6;
            background: #f8f9fa;
            padding: 25px;
            border-radius: 16px;
            border-left: 6px solid var(--celeste-patrio);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="columna-qr">
        <h1 style="font-size: 2.8rem; margin: 0; letter-spacing: 1px;">¡SUMATE A JUGAR!</h1>
        <p style="font-size: 1.3rem; opacity: 0.9; margin-top: 10px;">Escaneá el código QR con tu celular para ingresar tu usuario de Instagram</p>
        
        <div class="qr-placeholder">
            <img src="img/qr-trivia.png" alt="Escanear QR para Jugar">
        </div>
        
        <div style="font-size: 1.6rem; font-weight: bold; background: var(--amarillo-sol); color: var(--azul-patrio); padding: 10px 20px; border-radius: 30px;">
            🇦🇷 trivia25demayo.onrender.com
        </div>
    </div>

    <div class="columna-dinamica">
        <div class="tarjeta-contenedor">
            
            <div id="contenedor-ranking" class="modulo-pantalla">
                <h2>🏆 Tabla de Posiciones 🏆</h2>
                <table class="tabla-leaderboard">
                    <tbody id="lista-posiciones">
                        <tr><td class="puesto-top">#1</td><td class="usuario-name">@esperando_jugadores</td><td class="puntos-total">0 pts</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="contenedor-sabiasque" class="modulo-pantalla" style="display: none;">
                <h2>💡 ¿Sabías que...?</h2>
                <div class="contenido-curioso">
                    <div id="display-pregunta" class="texto-pregunta">Cargando dato histórico...</div>
                    <div id="display-explicacion" class="texto-explicacion">Por favor espere.</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Tu lógica WebSocket existente (ejemplo base de escucha)
        const socket = io();
        
        socket.on('actualizar_ranking', (usuarios) => {
            const tabla = document.getElementById('lista-posiciones');
            if (!tabla) return;
            
            // Renderizado dinámico según tu estructura backend de datos
            tabla.innerHTML = usuarios.map((user, index) => `
                <tr>
                    <td class="puesto-top">#${index + 1}</td>
                    <td class="usuario-name">@${user.username}</td>
                    <td class="puntos-total">${user.puntos} pts</td>
                </tr>
            `).join('');
        });

        // LÓGICA DE ROTACIÓN CÍCLICA CADA 10 SEGUNDOS
        let indiceCurioso = 0;
        let mostrandoRanking = true;

        function ejecutarRotacion() {
            const divRanking = document.getElementById('contenedor-ranking');
            const divSabiasQue = document.getElementById('contenedor-sabiasque');
            
            // Verificamos que el archivo externo cargó correctamente las preguntas
            if (typeof datosCuriosos === 'undefined' || datosCuriosos.length === 0) return;

            if (mostrandoRanking) {
                // 1. Ocultar Ranking, Mostrar "Sabías que..."
                divRanking.style.display = 'none';
                divSabiasQue.style.display = 'flex';
                
                // 2. Extraer el dato actual e inyectarlo en las cajas correspondientes
                const datoActual = datosCuriosos[indiceCurioso];
                document.getElementById('display-pregunta').innerText = datoActual.pregunta;
                document.getElementById('display-explicacion').innerText = datoActual.explicacion;
                
                // 3. Mover el índice para la siguiente vuelta (vuelve a cero al final usando el operador modular)
                indiceCurioso = (indiceCurioso + 1) % datosCuriosos.length;
                mostrandoRanking = false;
            } else {
                // 1. Ocultar Sabías que, Mostrar Ranking actualizado
                divSabiasQue.style.display = 'none';
                divRanking.style.display = 'flex';
                
                mostrandoRanking = true;
            }
        }

        // Ejecutar el loop permanente cada 10000ms (10 segundos exactos)
        setInterval(ejecutarRotacion, 10000);
    </script>
</body>
</html>
