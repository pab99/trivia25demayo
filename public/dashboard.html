<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control & Analítica - Trivia de Mayo 🇦🇷</title>
    <style>
        :root {
            --azul-oscuro: #0d2c54;
            --celeste: #74b9ff;
            --amarillo-sol: #fbcb3b;
            --rojo-error: #ff7675;
            --verde-exito: #2ecc71;
            --gris-claro: #f5f6fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8f9fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Pantalla de Login */
        #seccion-login {
            margin: auto;
            max-width: 400px;
            width: 100%;
            padding: 20px;
            background: white;
            border: 3px solid var(--azul-oscuro);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 10vh;
        }

        .input-login {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ced4da;
            border-radius: 8px;
            font-size: 1rem;
        }

        /* Contenedor Principal Dashboard */
        #seccion-dashboard {
            display: none;
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            padding: 20px;
            flex: 1;
        }

        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--azul-oscuro);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .grid-paneles {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .grid-paneles { grid-template-columns: 1fr; }
        }

        .tarjeta-control {
            background: white;
            border: 2px solid var(--azul-oscuro);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        .tarjeta-control h3 {
            color: var(--azul-oscuro);
            margin-bottom: 15px;
            border-left: 5px solid var(--celeste);
            padding-left: 10px;
        }

        /* Botones del Sistema */
        .btn-dash {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn-pdf { background-color: #e74c3c; }
        .btn-pdf:hover { background-color: #c0392b; }

        .btn-json { background-color: var(--azul-oscuro); }
        .btn-json:hover { background-color: #05162b; }

        .btn-reset { background-color: #7f8c8d; }
        .btn-reset:hover { background-color: #636e72; }
        .btn-reset.peligo { background-color: var(--rojo-error); }

        /* Gráficos con CSS Puro */
        .grafico-linea {
            background: var(--gris-claro);
            height: 180px;
            border-bottom: 2px solid #555;
            border-left: 2px solid #555;
            position: relative;
            margin-top: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 10px;
        }

        .punto-curva {
            width: 12px;
            background: var(--celeste);
            border-radius: 4px 4px 0 0;
            text-align: center;
            font-size: 0.75rem;
            color: var(--azul-oscuro);
            font-weight: bold;
        }

        .eje-x-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.8rem;
            color: #7f8c8d;
            padding: 0 5px;
        }

        .barra-porcentaje-contenedor { margin: 15px 0; }
        .barra-porcentaje-lbl { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: bold; margin-bottom: 4px; }
        .barra-progreso { background: #dfe6e9; height: 18px; border-radius: 10px; overflow: hidden; }
        .barra-progreso-llenado { height: 100%; background: var(--amarillo-sol); width: 0%; transition: width 0.6s ease; }

        /* 📋 Estilo de la Tabla de Ranking para Auditoría */
        .tabla-auditoria {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 0.95rem;
        }

        .tabla-auditoria th {
            background-color: var(--azul-oscuro);
            color: white;
            text-align: left;
            padding: 10px;
            font-weight: bold;
        }

        .tabla-auditoria td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .tabla-auditoria tr:nth-child(even) {
            background-color: var(--gris-claro);
        }

        .tabla-auditoria .txt-puntos-tabla {
            font-weight: bold;
            color: var(--verde-exito);
        }

        /* Footer Estilo Tecnoincas */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #7f8c8d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: white;
            border-top: 1px solid #ddd;
            margin-top: auto;
        }

        .logo-tecnoincas {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: repeating-conic-gradient(from 0deg, var(--amarillo-sol) 0deg 30deg, #d4a314 30deg 60deg);
            border: 2px solid #555;
            display: inline-block;
            position: relative;
        }
        .logo-tecnoincas::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: #95a5a6;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #555;
        }

        /* 🖨️ CONFIGURACIÓN DE IMPRESIÓN NATIVA (PDF AUTOMÁTICO) */
        @media print {
            body { background: white; color: black; }
            #seccion-login, .header-dash, .tarjeta-control:nth-child(1), footer { display: none !important; }
            #seccion-dashboard { display: block !important; margin: 0; padding: 0; width: 100%;
