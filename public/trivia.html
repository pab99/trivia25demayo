<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Juego - Trivia de Mayo 🇦🇷</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --azul-oscuro: #0d2c54;
            --celeste: #74b9ff;
            --amarillo-sol: #fbcb3b;
            --rojo-error: #ff7675;
            --verde-exito: #2ecc71;
            --gris-claro: #f5f6fa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--gris-claro);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .cabecera-juego {
            max-width: 600px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            border: 2px solid var(--azul-oscuro);
        }

        .indicador { font-weight: bold; font-size: 0.95rem; }
        .indicador span { color: var(--azul-oscuro); font-size: 1.1rem; }

        .contenedor-timer {
            max-width: 600px;
            width: 100%;
            background: #dfe6e9;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid #ccd1d9;
        }

        .barra-timer {
            height: 100%;
            width: 100%;
            background: var(--verde-exito);
            transition: width 0.1s linear, background-color 0.5s ease;
        }

        .panel-pregunta {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            text-align: center;
            border: 3px solid var(--celeste);
            margin-bottom: 20px;
        }

        .num-pregunta {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .texto-pregunta {
            font-size: 1.3rem;
            color: var(--azul-oscuro);
            font-weight: bold;
            line-height: 1.4;
        }

        .grilla-opciones {
            max-width: 600px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .btn-opcion {
            background: white;
            border: 2px solid #ccd1d9;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.05rem;
            text-align: left;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-opcion:hover:not(:disabled) {
            background: #f0f4f8;
            border-color: var(--azul-oscuro);
        }

        .btn-opcion.correcta {
            background: var(--verde-exito) !important;
            color: white !important;
            border-color: #27ae60 !important;
        }

        .btn-opcion.incorrecta {
            background: var(--rojo-error) !important;
            color: white !important;
            border-color: #e74c3c !important;
        }

        .panel-pantalla-final {
            display: none;
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px 25px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            text-align: center;
            border: 4px solid var(--amarillo-sol);
            margin-top: 5vh;
        }

        .combo-badge {
            background: var(--amarillo-sol);
            color: var(--azul-oscuro);
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            display: none;
        }

        .btn-final {
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: var(--azul-oscuro);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA EN JUEGO -->
    <div id="contenedor-juego" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="cabecera-juego">
            <div class="indicador">Puntos: <span id="lbl-puntos">0</span></div>
            <div class="indicador"><span id="lbl-combo" class="combo-badge">🔥 Combo x0</span></div>
            <div class="indicador">Vidas: <span id="lbl-vidas">❤️❤️❤️</span></div>
        </div>

        <div class="contenedor-timer">
            <div id="barra-progreso-timer" class="barra-timer"></div>
        </div>

        <div class="panel-pregunta">
            <div id="lbl-num-pregunta" class="num-pregunta">Pregunta 1 de 10</div>
            <div id="lbl-texto-pregunta" class="texto-pregunta">Cargando pregunta...</div>
        </div>

        <div id="contenedor-opciones" class="grilla-opciones">
            <!-- Botones inyectados dinámicamente -->
        </div>
    </div>

    <!-- PANTALLA DE RESULTADO FINAL (GAME OVER / COMPLETO) -->
    <div id="pantalla-final" class="panel-pantalla-final">
        <h2 id="final-titulo" style="font-size: 2rem; color: var(--azul-oscuro); margin-bottom: 15px;">Fin del Juego</h2>
        <p id="final-mensaje" style="font-size: 1.1rem; color: #555; margin-bottom: 25px;"></p>
        <div style="background: var(--gris-claro); padding: 20px; border-radius: 12px; border: 1px solid #ddd;">
            <div style="font-size: 1rem; color: #7f8c8d;">PUNTAJE OBTENIDO EN ESTA RONDA</div>
            <div id="final-puntos" style="font-size: 3rem; font-weight: bold; color: var(--verde-exito); margin: 10px 0;">0</div>
            <div style="font-size: 1.1rem; font-weight: bold; color: var(--azul-oscuro);">Puesto Actual en el Ranking: <span id="final-puesto">#0</span></div>
        </div>
        <button class="btn-final" onclick="volverAIntentar()">VOLVER A PARTICIPAR / REVANCHA</button>
    </div>

    <script>
        const socket = io();
        let preguntaActualId = null;
        let intentoActual = 1;
        let tiempoMaximo = 20;
        let tiempoRestante = 20;
        let timerInterval = null;
        let marcaTiempoInicio = 0;
        let bloqueadoTotal = false;

        // Recuperar usuario registrado
        const usuarioLocal = localStorage.getItem('usuario_trivia');
        if (!usuarioLocal) {
            window.location.href = '/';
        } else {
            // Reconectar el socket al perfil del usuario
            socket.emit('join_game', usuarioLocal);
            // Solicitar la primera pregunta
            socket.emit('get_pregunta');
        }

        socket.on('pregunta_data', (data) => {
            bloqueadoTotal = false;
            preguntaActualId = data.id;
            intentoActual = 1;
            
            document.getElementById('lbl-num-pregunta').innerText = `Pregunta ${data.numeroPregunta} de 10`;
            document.getElementById('lbl-texto-pregunta').innerText = data.pregunta;
            
            const contenedor = document.getElementById('contenedor-opciones');
            contenedor.innerHTML = "";
            
            data.opciones.forEach(opcion => {
                const btn = document.createElement('button');
                btn.className = 'btn-opcion';
                btn.innerText = opcion;
                btn.onclick = () => procesarEleccion(btn, opcion);
                contenedor.appendChild(btn);
            });

            iniciarContadorRegresivo();
        });

        function iniciarContadorRegresivo() {
            clearInterval(timerInterval);
            tiempoRestante = tiempoMaximo;
            marcaTiempoInicio = Date.now();
            
            const barra = document.getElementById('barra-progreso-timer');
            barra.style.width = '100%';
            barra.style.backgroundColor = 'var(--verde-exito)';

            timerInterval = setInterval(() => {
                tiempoRestante -= 0.1;
                let porcentaje = (tiempoRestante / tiempoMaximo) * 100;
                barra.style.width = `${porcentaje}%`;

                if (porcentaje < 50 && porcentaje > 25) {
                    barra.style.backgroundColor = 'var(--amarillo-sol)';
                } else if (porcentaje <= 25) {
                    barra.style.backgroundColor = 'var(--rojo-error)';
                }

                if (tiempoRestante <= 0) {
                    clearInterval(timerInterval);
                    manejarTiempoAgotado();
                }
            }, 100);
        }

        function procesarEleccion(btnSeleccionado, opcionTexto) {
            if (bloqueadoTotal) return;
            clearInterval(timerInterval);

            let tiempoEmpleado = (Date.now() - marcaTiempoInicio) / 1000;

            // Bloqueamos clics repetidos
            const botones = document.querySelectorAll('.btn-opcion');
            botones.forEach(b => b.disabled = true);

            socket.emit('enviar_respuesta', {
                preguntaId: preguntaActualId,
                respuesta: opcionTexto,
                intento: intentoActual,
                tiempoEmpleado: tiempoEmpleado
            });
        }

        socket.on('resultado_respuesta', (res) => {
            const botones = document.querySelectorAll('.btn-opcion');
            
            if (res.correcta) {
                // Pintar de verde el que clickeó
                botones.forEach(b => {
                    if (b.disabled && b.style.backgroundColor !== '') return; 
                    // Si el backend validó la respuesta, buscamos el seleccionado
                    b.classList.forEach(c => {});
                });

                // Hack rápido visual para pintar la correcta elegida
                botones.forEach(b => {
                    if (b.disabled && b.matches(':focus') || botones.length === 1 || b.style.borderColor === 'var(--azul-oscuro)') {}
                });

                // Para simplificar, buscamos cuál fue pulsado justo antes
                let algunoPintado = false;
                botones.forEach(b => {
                    b.onclick = null;
                });
                
                // Forzar feedback del evento actual buscando foco o aplicando clase al vuelo
                // El server responde rápido, usamos un retraso para avanzar
                document.getElementById('lbl-puntos').innerText = res.puntos;
                
                // Manejo de badge de combo
                const badgeCombo = document.getElementById('lbl-combo');
                if (res.combo > 0) {
                    badgeCombo.innerText = `🔥 Combo x${res.combo}`;
                    badgeCombo.style.display = 'inline-block';
                } else {
                    badgeCombo.style.display = 'none';
                }

                setTimeout(() => {
                    socket.emit('get_pregunta');
                }, 1200);

            } else {
                // Fue incorrecta
                if (res.intento === 1) {
                    // Dar segunda oportunidad
                    intentoActual = 2;
                    alert('❌ Respuesta incorrecta. ¡Tenés un segundo intento por la mitad de los puntos!');
                    botones.forEach(b => b.disabled = false);
                    iniciarContadorRegresivo(); // Resetea el tiempo para el intento 2
                } else {
                    // Perdió el segundo intento o fue tiempo agotado
                    actualizarVidasVisual(res.vidas);
                    document.getElementById('lbl-combo').style.display = 'none';
                    
                    setTimeout(() => {
                        socket.emit('get_pregunta');
                    }, 1200);
                }
            }
        });

        function manejarTiempoAgotado() {
            bloqueadoTotal = true;
            const botones = document.querySelectorAll('.btn-opcion');
            botones.forEach(b => b.disabled = true);

            socket.emit('enviar_respuesta', {
                preguntaId: preguntaActualId,
                respuesta: "__TIEMPO_AGOTADO__",
                intento: 2,
                tiempoEmpleado: 20
            });
        }

        function actualizarVidasVisual(cantVidas) {
            let corazones = "";
            for (let i = 0; i < 3; i++) {
                corazones += i < cantVidas ? "❤️" : "🖤";
            }
            document.getElementById('lbl-vidas').innerText = corazones;
        }

        // Eventos de finalización
        socket.on('game_over', (data) => {
            mostrarPantallaFinal("🚨 Juego Terminado", "Te quedaste sin vidas. ¡Buen intento!", data);
        });

        socket.on('game_completed', (data) => {
            mostrarPantallaFinal("🏆 ¡Felicitaciones!", "Completaste las 10 preguntas de la ronda con éxito.", data);
        });

        function mostrarPantallaFinal(titulo, mensaje, data) {
            clearInterval(timerInterval);
            document.getElementById('contenedor-juego').style.display = 'none';
            document.getElementById('pantalla-final').style.display = 'block';
            
            document.getElementById('final-titulo').innerText = titulo;
            document.getElementById('final-mensaje').innerText = mensaje;
            document.getElementById('final-puntos').innerText = data.puntos + " pts";
            document.getElementById('final-puesto').innerText = `#${data.puesto}`;
        }

        function volverAIntentar() {
            socket.emit('reset_game');
            window.location.href = '/';
        }
    </script>
</body>
</html>
